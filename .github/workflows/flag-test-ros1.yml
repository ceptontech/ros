name: Driver parameter test (ROS1)

on:
  pull_request:
  workflow_dispatch:

jobs:
  driver-parameter-tests:
    name: Check flag filters and frame aggregation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build . --tag ci_ros1_flag_test_$GITHUB_SHA -f ci/Dockerfile.ros1

      - name: Run driver parameter tests
        run: |
          docker run --rm --network host --ipc host \
            -v "${GITHUB_WORKSPACE}:/app:rw" ci_ros1_flag_test_$GITHUB_SHA bash -euo pipefail -c '
          source /opt/ros/noetic/setup.bash

          mkdir -p /root/Documents/Cepton
          cp /app/scripts/flag_test/calibration/calibration_3276808.bin \
            /root/Documents/Cepton/

          mkdir -p /catkin_ws/src
          ln -s /app/ros /catkin_ws/src/cepton_ros
          cd /catkin_ws
          catkin_make
          source devel/setup.bash

          roscore > /tmp/roscore.log 2>&1 &
          roscore_pid=$!
          for attempt in {1..300}; do
            rosparam list > /dev/null 2>&1 && break
            sleep 0.1
          done
          rosparam list > /dev/null

          cleanup() {
            kill "${publisher_pid:-}" "${manager_pid:-}" "${roscore_pid:-}" 2>/dev/null || true
            wait "${publisher_pid:-}" "${manager_pid:-}" "${roscore_pid:-}" 2>/dev/null || true
          }
          trap cleanup EXIT

          count_points() {
            local case_name="$1"
            local parameter="$2"
            local value="$3"
            local result_file="$4"
            local output
            local params_file="/tmp/cepton_${case_name}.yaml"

            cp /app/scripts/flag_test/ros1/baseline.yaml "$params_file"
            if [ -n "$parameter" ]; then
              sed -i -E "s|^${parameter}:.*|${parameter}: ${value}|" "$params_file"
              grep -qx "${parameter}: ${value}" "$params_file"
            fi

            rosrun nodelet nodelet manager __name:=cepton_manager \
              > /tmp/cepton_manager.log 2>&1 &
            manager_pid=$!
            for attempt in {1..300}; do
              rosservice list 2> /dev/null | grep -qx /cepton_manager/load_nodelet && break
              sleep 0.1
            done
            rosservice list | grep -qx /cepton_manager/load_nodelet

            # 全フレームを同じ点数にしているが、target-stamp なしでは安定しない。
            python3 /app/scripts/flag_test/count_points_ros1.py \
              --timeout 120 \
              --target-stamp 80.557132000 \
              > /tmp/cepton_count_points.out 2>&1 &
            local subscriber_pid=$!
            sleep 1

            roslaunch cepton_ros publisher.launch config_path:="$params_file" \
              > /tmp/cepton_driver_parameter_test.log 2>&1 &
            publisher_pid=$!

            set +e
            wait "$subscriber_pid"
            local rc=$?
            output=$(cat /tmp/cepton_count_points.out)
            set -e

            kill "$publisher_pid" 2>/dev/null || true
            wait "$publisher_pid" 2>/dev/null || true
            unset publisher_pid
            kill "$manager_pid" 2>/dev/null || true
            wait "$manager_pid" 2>/dev/null || true
            unset manager_pid

            if [ "$rc" -ne 0 ]; then
              echo "$output"
              echo "--- publisher log ---"
              tail -80 /tmp/cepton_driver_parameter_test.log
              return "$rc"
            fi

            echo "$output"
            echo "$output" | awk -F= "/^POINT_COUNT=/ {print \$2}" > "$result_file"
          }

          count_points baseline "" "" /tmp/baseline.count
          count_points exclude_invalid include_invalid_points false /tmp/invalid.count
          count_points exclude_noise include_noise_points false /tmp/noise.count
          count_points exclude_retro include_retro_points false /tmp/retro.count
          count_points exclude_retro_weak include_retro_weak_points false /tmp/retro_weak.count
          count_points aggregate_2 aggregate_frames true /tmp/aggregate_2.count

          baseline=$(cat /tmp/baseline.count)
          invalid=$(cat /tmp/invalid.count)
          noise=$(cat /tmp/noise.count)
          retro=$(cat /tmp/retro.count)
          retro_weak=$(cat /tmp/retro_weak.count)
          aggregate_2=$(cat /tmp/aggregate_2.count)

          invalid_delta=$((baseline - invalid))
          noise_delta=$((baseline - noise))
          retro_delta=$((baseline - retro))
          retro_weak_delta=$((baseline - retro_weak))
          aggregate_expected=$((baseline * 2))

          echo "baseline=$baseline"
          echo "exclude_invalid=$invalid delta=$invalid_delta expected=1"
          echo "exclude_noise=$noise delta=$noise_delta expected=2"
          echo "exclude_retro=$retro delta=$retro_delta expected=4"
          echo "exclude_retro_weak=$retro_weak delta=$retro_weak_delta expected=8"
          echo "aggregate_2=$aggregate_2 expected=$aggregate_expected"

          test "$invalid_delta" -eq 1
          test "$noise_delta" -eq 2
          test "$retro_delta" -eq 4
          test "$retro_weak_delta" -eq 8
          test "$aggregate_2" -eq "$aggregate_expected"
          '
