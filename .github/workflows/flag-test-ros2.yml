name: Driver parameter test (ROS2)

on:
  pull_request:
  workflow_dispatch:

jobs:
  driver-parameter-tests:
    name: Check flag filters and frame aggregation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build docker image
        run: docker build . --tag ci_ros2_flag_test_$GITHUB_SHA -f ci/Dockerfile.ros2

      - name: Run driver parameter tests
        run: |
          docker run --rm --network host --ipc host \
            -v "${GITHUB_WORKSPACE}:/app:rw" ci_ros2_flag_test_$GITHUB_SHA bash -euo pipefail -c '
          cd /app
          mkdir -p /root/Documents/Cepton
          cp scripts/flag_test/calibration/calibration_3276808.bin /root/Documents/Cepton/

          export RMW_IMPLEMENTATION=rmw_fastrtps_cpp
          export ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u

          colcon --log-base /tmp/cepton_log build \
            --packages-select cepton_messages cepton_publisher \
            --build-base /tmp/cepton_build \
            --install-base /tmp/cepton_install \
            --cmake-args -DCMAKE_CXX_FLAGS=-DWITH_TS_CH_F

          set +u
          source /tmp/cepton_install/setup.bash
          set -u

          count_points() {
            local case_name="$1"
            local domain_id="$2"
            local parameter="$3"
            local value="$4"
            local result_file="$5"
            local output
            local parameter_args=()

            export ROS_DOMAIN_ID="$domain_id"
            if [ -n "$parameter" ]; then
              parameter_args=(-p "$parameter:=$value")
            fi
            echo "Counting points for $case_name on ROS_DOMAIN_ID=$ROS_DOMAIN_ID"

            # 全フレームを同じ点数にしているが、target-stamp なしでは安定しない。
            python3 scripts/flag_test/count_points_ros2.py \
              --timeout 120 \
              --target-stamp 80.557132000 \
              > /tmp/cepton_count_points.out 2>&1 &
            local subscriber_pid=$!
            sleep 1

            ros2 run cepton_publisher cepton_publisher_node \
              --ros-args --params-file scripts/flag_test/params/baseline.yaml \
              "${parameter_args[@]}" > /tmp/cepton_driver_parameter_test.log 2>&1 &
            local publisher_pid=$!

            set +e
            wait "$subscriber_pid"
            local rc=$?
            output=$(cat /tmp/cepton_count_points.out)
            set -e

            kill "$publisher_pid" 2>/dev/null || true
            wait "$publisher_pid" 2>/dev/null || true

            if [ "$rc" -ne 0 ]; then
              echo "$output"
              echo "--- publisher log ---"
              tail -80 /tmp/cepton_driver_parameter_test.log
              return "$rc"
            fi

            echo "$output"
            echo "$output" | awk -F= "/^POINT_COUNT=/ {print \$2}" > "$result_file"
          }

          count_points baseline 1 "" "" /tmp/baseline.count
          count_points exclude_invalid 2 include_invalid_points false /tmp/invalid.count
          count_points exclude_noise 3 include_noise_points false /tmp/noise.count
          count_points exclude_retro 4 include_retro_points false /tmp/retro.count
          count_points exclude_retro_weak 5 include_retro_weak_points false /tmp/retro_weak.count
          count_points aggregate_2 6 aggregation_frame_count 2 /tmp/aggregate_2.count

          baseline=$(cat /tmp/baseline.count)
          invalid=$(cat /tmp/invalid.count)
          noise=$(cat /tmp/noise.count)
          retro=$(cat /tmp/retro.count)
          retro_weak=$(cat /tmp/retro_weak.count)
          aggregate_2=$(cat /tmp/aggregate_2.count)

          invalid_delta=$((baseline - invalid))
          noise_delta=$((baseline - noise))
          retro_delta=$((baseline - retro))
          retro_weak_delta=$((baseline - retro_weak))
          aggregate_expected=$((baseline * 2))

          echo "baseline=$baseline"
          echo "exclude_invalid=$invalid delta=$invalid_delta expected=1"
          echo "exclude_noise=$noise delta=$noise_delta expected=2"
          echo "exclude_retro=$retro delta=$retro_delta expected=4"
          echo "exclude_retro_weak=$retro_weak delta=$retro_weak_delta expected=8"
          echo "aggregate_2=$aggregate_2 expected=$aggregate_expected"

          test "$invalid_delta" -eq 1
          test "$noise_delta" -eq 2
          test "$retro_delta" -eq 4
          test "$retro_weak_delta" -eq 8
          test "$aggregate_2" -eq "$aggregate_expected"
          '
